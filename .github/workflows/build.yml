name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_B64 secret is not set; the APK is signed with a throwaway key and will not be released."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test, lint, build
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk VolumeLimiter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeLimiter-apk
          path: VolumeLimiter.apk

      - name: Publish release
        if: steps.key.outputs.present == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" VolumeLimiter.apk \
            --title "Volume Limiter 1.0.${{ github.run_number }}" \
            --notes "Signed APK for Fire OS 7 (Android 9) and newer. Install over the previous version to update." \
            --latest
